name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html mp3data*.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Miniature com.miniaturemusic.v2 --web-dir www
          npx cap add android

      - name: Set app icon
        run: |
          ICON=$(ls | grep -i -E '^icon.*\.png$' | head -1 || true)
          if [ -z "$ICON" ]; then echo "NO ICON PNG FOUND in repo root - skipping icon"; ls; exit 0; fi
          echo "Using icon file: $ICON"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install pillow
          cat > /tmp/mkicon.py <<'PYEOF'
          import sys, os, shutil
          from PIL import Image, ImageDraw
          src = Image.open(sys.argv[1]).convert("RGBA")
          res = "android/app/src/main/res"
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in sizes.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              sq = src.resize((px, px), Image.LANCZOS)
              sq.save(f"{folder}/ic_launcher.png")
              m = Image.new("L", (px, px), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px - 1, px - 1), fill=255)
              r = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              r.paste(sq, (0, 0), m)
              r.save(f"{folder}/ic_launcher_round.png")
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          print("icons written")
          PYEOF
          /tmp/venv/bin/python /tmp/mkicon.py "$ICON"

      - name: Add music scan plugin and permissions
        run: |
          JAVA_DIR=android/app/src/main/java/com/miniaturemusic/v2
          mkdir -p $JAVA_DIR
          cp MusicScanPlugin.java MainActivity.java $JAVA_DIR/
          sed -i 's/^package .*;/package com.miniaturemusic.v2;/' $JAVA_DIR/MusicScanPlugin.java $JAVA_DIR/MainActivity.java
          head -1 $JAVA_DIR/MusicScanPlugin.java $JAVA_DIR/MainActivity.java
          ls -la $JAVA_DIR
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore && echo "Using fixed signing key"; fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Miniature-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
