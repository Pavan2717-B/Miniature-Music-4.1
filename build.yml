name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html mp3data*.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Miniature com.miniaturemusic.v2 --web-dir www
          npx cap add android

      - name: Set app icon and launch screen
        run: |
          ICON=$(ls | grep -i -E '^icon.*\.png$' | head -1 || true)
          if [ -z "$ICON" ]; then echo "NO ICON PNG FOUND in repo root - skipping icon"; ls; exit 0; fi
          echo "Using icon file: $ICON"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install pillow
          cat > /tmp/mkicon.py <<'PYEOF'
          import sys, os, shutil
          from PIL import Image, ImageDraw, ImageFont
          src = Image.open(sys.argv[1]).convert("RGB")
          res = "android/app/src/main/res"
          NAVY = (8, 12, 22)

          # launcher icons (square + round)
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in sizes.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              sq = src.resize((px, px), Image.LANCZOS).convert("RGBA")
              sq.save(f"{folder}/ic_launcher.png")
              m = Image.new("L", (px, px), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px - 1, px - 1), fill=255)
              r = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              r.paste(sq, (0, 0), m)
              r.save(f"{folder}/ic_launcher_round.png")
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)

          # launch splash: logo on navy, developer credit at the bottom
          def font(size):
              for p in ("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                        "/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf"):
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)
              try:
                  return ImageFont.load_default(size)
              except Exception:
                  return ImageFont.load_default()

          count = 0
          for root, _, files in os.walk(res):
              for f in files:
                  if f == "splash.png":
                      path = os.path.join(root, f)
                      w, h = Image.open(path).size
                      bg = Image.new("RGB", (w, h), NAVY)
                      lw = int(min(w, h) * 0.5)
                      logo = src.resize((lw, lw), Image.LANCZOS)
                      bg.paste(logo, ((w - lw) // 2, int(h * 0.47 - lw / 2)))
                      d = ImageDraw.Draw(bg)
                      fs = max(12, int(min(w, h) * 0.034))
                      d.text((w / 2, h * 0.94), "~developer-Pavan", font=font(fs), fill=(125, 128, 138), anchor="ms")
                      bg.save(path)
                      count += 1
          print("icons written, splash files:", count)
          PYEOF
          /tmp/venv/bin/python /tmp/mkicon.py "$ICON"
          cat > /tmp/styles.py <<'PYEOF'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p).read()
          print(s)
          if "Theme.SplashScreen" in s and "windowSplashScreenBackground" not in s:
              s = re.sub(r'(<style name="AppTheme.NoActionBarLaunch"[^>]*>)', r'\1\n        <item name="windowSplashScreenBackground">#080c16</item>', s)
              open(p, "w").write(s)
              print("Android 12 splash background set")
          PYEOF
          python3 /tmp/styles.py

      - name: Add plugin, service and permissions
        run: |
          JAVA_DIR=android/app/src/main/java/com/miniaturemusic/v2
          mkdir -p $JAVA_DIR
          cp MusicScanPlugin.java MainActivity.java KeepAliveService.java $JAVA_DIR/
          sed -i 's/^package .*;/package com.miniaturemusic.v2;/' $JAVA_DIR/MusicScanPlugin.java $JAVA_DIR/MainActivity.java $JAVA_DIR/KeepAliveService.java
          head -1 $JAVA_DIR/*.java
          ls -la $JAVA_DIR
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          sed -i 's#</application>#    <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' $M
          cat $M

      - name: Build APK
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore && echo "Using fixed signing key"; fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Miniature-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
